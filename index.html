<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Peres Lavagem Automotiva · Agendamentos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070d">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070d;--card:#0a1322;--card2:#0e1b33;--line:#17315f;--b:#1e6bff;--b2:#38b6ff;--tx:#eef4ff;--mut:#8ea3c7;--ok:#27d98a;--bad:#ff4d6a;--warn:#ffb020;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3,.hd{font-family:"Chakra Petch",Inter,sans-serif;margin:0}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;z-index:0;pointer-events:none}
#shade{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at top,rgba(30,107,255,.15),transparent 60%),linear-gradient(rgba(4,7,13,.35),rgba(4,7,13,.7))}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 16px 90px}
.top{display:flex;align-items:center;gap:12px}
.top img{width:64px;height:64px;filter:drop-shadow(0 0 14px rgba(56,182,255,.5));animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-3px)}}
.top h1{font-size:22px;line-height:1.1;letter-spacing:.3px}
.top small{color:var(--mut)}
.sp{flex:1}
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;font:600 15px "Chakra Petch",Inter,sans-serif;color:#fff;background:linear-gradient(135deg,var(--b),var(--b2));padding:13px 18px;border-radius:12px;box-shadow:0 6px 20px rgba(30,107,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .5s}
.btn:hover::after{left:130%}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.95);box-shadow:0 2px 8px rgba(30,107,255,.4)}
.btn.g{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--tx)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.r{background:linear-gradient(135deg,#d6243f,var(--bad));box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#17a566,var(--ok));box-shadow:none;color:#04180f}
.btn.w{width:100%}
.card{background:rgba(8,15,28,.82);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px;backdrop-filter:blur(6px)}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pr{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;transition:transform .2s}
.pr:active{transform:scale(.96)}
.pr span{display:block;color:var(--mut);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.pr b{font:700 20px "Chakra Petch";color:var(--b2)}
.svs{display:grid;gap:8px}.sv{background:rgba(8,15,28,.82);border:1px solid var(--line);border-radius:14px;padding:12px;backdrop-filter:blur(6px);transition:transform .15s}.sv:active{transform:scale(.98)}.sv b{font:700 16px "Chakra Petch"}.sv p{margin:3px 0 0;color:var(--mut);font-size:13px}.sv .pp{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.per{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.per b{font:700 20px "Chakra Petch";color:var(--b2)}.per small{display:block;color:var(--mut)}.per div:last-child{text-align:right}select{appearance:none}
.sec{font:700 13px "Chakra Petch";letter-spacing:2px;text-transform:uppercase;color:var(--b2);margin:22px 0 8px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.day{flex:0 0 auto;min-width:62px;text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;color:var(--tx);font:inherit;transition:transform .15s,background .2s}
.day:active{transform:scale(.92)}
.day small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase}
.day b{font:700 18px "Chakra Petch"}
.day.on{background:linear-gradient(135deg,var(--b),var(--b2));border-color:transparent;box-shadow:0 4px 16px rgba(30,107,255,.4)}
.day.on small{color:#e3f1ff}
.slot{display:flex;align-items:center;gap:12px;background:rgba(8,15,28,.82);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;transition:transform .15s,border-color .2s;animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.slot.free{cursor:pointer}
.slot.free:hover{border-color:var(--b2)}
.slot.free:active{transform:scale(.97)}
.tm{font:700 21px "Chakra Petch";background:var(--b);border-radius:10px;padding:6px 10px;min-width:74px;text-align:center}
.slot.busy .tm{background:#1b2740;color:var(--mut)}
.slot .inf{flex:1;min-width:0}
.slot .inf b{display:block;font-weight:600}
.slot .inf small{color:var(--mut)}
.pill{font:600 12px Inter;padding:5px 10px;border-radius:99px;white-space:nowrap}
.pill.f{background:rgba(39,217,138,.14);color:var(--ok)}
.pill.o{background:rgba(255,77,106,.14);color:var(--bad)}
.pill.d{background:rgba(56,182,255,.16);color:var(--b2)}
.pill.x{background:rgba(255,176,32,.14);color:var(--warn)}
.lunch{text-align:center;color:var(--mut);font-size:13px;border:1px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.mt{position:fixed;inset:0;z-index:20;background:rgba(2,5,10,.78);display:none;align-items:flex-end;justify-content:center}
.mt.on{display:flex;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#08101f;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;letter-spacing:.5px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--tx);font:inherit;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--b2);box-shadow:0 0 0 3px rgba(56,182,255,.2)}
.row{display:flex;gap:8px}.row>*{flex:1}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ty{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;color:var(--tx);font:inherit;transition:transform .15s}
.ty:active{transform:scale(.93)}
.ty.on{background:linear-gradient(135deg,var(--b),var(--b2));border-color:transparent}
.ty b{display:block;font:700 15px "Chakra Petch"}.ty small{opacity:.8}
.tot{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px;font:700 20px "Chakra Petch"}
.tot span{color:var(--mut);font:500 13px Inter}
.ok-box{text-align:center;padding:10px 0}
.ok-box .ck{width:68px;height:68px;border-radius:50%;margin:0 auto 10px;background:rgba(39,217,138,.15);display:grid;place-items:center;font-size:34px;color:var(--ok);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}
#adm{position:fixed;inset:0;z-index:15;background:rgba(4,7,13,.97);overflow:auto;display:none}
#adm.on{display:block}
.tabs{display:flex;gap:6px;margin:14px 0}
.tab{flex:1;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font:600 14px "Chakra Petch";cursor:pointer;transition:transform .15s}
.tab:active{transform:scale(.94)}
.tab.on{background:var(--b);color:#fff;border-color:var(--b)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.st{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
.st span{color:var(--mut);font-size:12px}.st b{display:block;font:700 22px "Chakra Petch";color:var(--b2)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.det{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;background:var(--b);padding:11px 18px;border-radius:12px;font-weight:600;animation:in .3s;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:26px}
.foot a{color:var(--b2);text-decoration:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

 const r=await fetch(U+"/rest/v1/"+path,{method:o.method||"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined});const tx=await r.text();if(!r.ok){const e=new Error(r.status);e.status=r.status;throw e}return tx?JSON.parse(tx):null}
const toBook=rows=>{const b={};rows.forEach(r=>{if(r.status==="cancelado")return;(b[r.date]=b[r.date]||{})[r.time]={...r,price:+r.price||0}});return b};
async function refresh(){try{if(S.admin)S.book=toBook(await api("bookings?select=*&order=date,time&limit=5000",{auth:true}));
 else S.book=toBook(await api("horarios_ocupados?select=date,time,status&date=gte."+dk(new Date(Date.now()-864e5))));S.err=0;S.ready=1}
 catch(e){if(S.admin&&(e.status===401||e.status===403)){S.admin=false;setSess(null);$("#adm").classList.remove("on");toast("Sessão expirada");return refresh()}S.err=1}
 try{const c=await api("config?id=eq.1&select=svc");if(c&&c[0])S.svc=c[0].svc}catch(e){}
 render();if($("#adm").classList.contains("on"))adm()}
async function init(){try{const r=localStorage.getItem(KEY);if(r)sess=JSON.parse(r)}catch(e){}
 if(sess){try{await ensure();const a=await api("admins?select=user_id",{auth:true});S.admin=!!(a&&a.length);if(!S.admin)setSess(null)}catch(e){setSess(null)}}
 await refresh();setInterval(()=>{if(!document.hidden&&!$("#md").classList.contains("on")&&!$("#adm").classList.contains("on"))refresh()},30000)}
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=k=>k.split("-").reverse().slice(0,2).join("/");
const DOW=["dom","seg","ter","qua","qui","sex","sáb"];
function dayList(){const t=new Date();t.setHours(0,0,0,0);const m=new Date(2026,9,28);let s=t>m?t:m;return[...Array(14)].map((_,i)=>{const d=new Date(s);d.setDate(d.getDate()+i);return d}).filter(d=>d.getDay()!==0)}
const DAYS=dayList();let sel=dk(DAYS[0]),tab="ag",aSel=sel;
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)}
const bk=(d,t)=>(S.book[d]||{})[t];
const past=(d,t)=>{const n=new Date();return d===dk(n)&&t<=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0")};
function daysHtml(cur,act){return DAYS.map(d=>{const k=dk(d);return`<button class="day ${k===cur?"on":""}" data-a="${act}" data-d="${k}"><small>${DOW[d.getDay()]}</small><b>${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}</b></button>`}).join("")}
function render(){
 $("#wa").href="https://wa.me/"+WA;
 $("#svs").innerHTML=SV.map(([id,n,d,m,f])=>{const ks=(m==="u"?["u"]:Object.keys(TN)).filter(k=>pv(id,k)!=null);return`<div class="sv"><b>${n}</b><p>${d}</p><div class="pp">${ks.length?ks.map(k=>`<span class="pill d">${m==="u"?(f?"A partir de ":""):TN[k]+" "}${pt(pv(id,k))}</span>`).join(""):`<span class="pill x">Sob consulta · chame no WhatsApp</span>`}</div></div>`}).join("");
 $("#days").innerHTML=daysHtml(sel,"day");
 if(!S.ready){$("#slots").innerHTML=S.err?`<div class="lunch">Sem conexão com o servidor.<br><button class="btn sm" style="margin-top:8px" data-a="retry">Tentar de novo</button></div>`:`<div class="lunch">Carregando horários…</div>`;return}
 let h="";SL.forEach(([a,u],i)=>{if(a==="13:30")h+=`<div class="lunch">🍴 Almoço · 12:00 às 13:30</div>`;
  const x=bk(sel,a),p=past(sel,a);let st,cls="free",pill=`<span class="pill f">Livre</span>`,inf=`<small>Toque para agendar</small>`;
  if(p){cls="busy";pill=`<span class="pill x">Encerrado</span>`;inf=`<small>Horário já passou</small>`}
  else if(x){cls="busy";pill=x.status==="bloqueado"?`<span class="pill x">Indisponível</span>`:`<span class="pill o">Ocupado</span>`;inf=`<small>${x.status==="bloqueado"?"Bloqueado":"Já reservado"}</small>`}
  h+=`<div class="slot ${cls}" style="animation-delay:${i*50}ms" ${cls==="free"?`data-a="book" data-t="${a}"`:""}><div class="tm">${a}</div><div class="inf"><b>Horário ${i+1}</b>${inf.replace("<small>","<small>Até "+u+" · ")}</div>${pill}</div>`});
 $("#slots").innerHTML=(S.err?`<div class="lunch">Sem conexão. Os horários podem estar desatualizados. <a href="#" data-a="retry" style="color:var(--b2)">Atualizar</a></div>`:"")+h}
function sheet(h){$("#sh").innerHTML=h;$("#md").classList.add("on")}
function closeSheet(){$("#md").classList.remove("on")}
let F={};
function form(d,t,admin){F={d,t,admin,type:"carro",svc:"comercial"};
 sheet(`<h2 style="font-size:20px">Agendar · ${fmt(d)} às ${t}</h2><small class="det">Preencha os dados para confirmar</small>
 <label>SERVIÇO</label><select id="fs">${SV.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("")}</select>
 <label>NOME COMPLETO</label><input id="fn" autocomplete="name" placeholder="Seu nome">
 <label>TELEFONE / WHATSAPP</label><input id="fp" inputmode="tel" autocomplete="tel" placeholder="(55) 99999-9999">
 <label>E-MAIL (OPCIONAL · PARA VINCULAR COM O GOOGLE)</label><input id="fe" type="email" autocomplete="email" placeholder="voce@gmail.com">
 <div id="fw"><label>TIPO DE VEÍCULO</label><div class="types" id="ft"></div></div>
 <div class="row"><div><label>VEÍCULO (MODELO)</label><input id="fv" placeholder="Ex.: Prisma"></div><div><label>COR</label><input id="fc" placeholder="Ex.: Branco"></div></div>
 <div class="tot"><div><span>Total</span><br><b id="ftot"></b></div><button class="btn" data-a="confirm">Confirmar</button></div>
 <button class="btn g w" data-a="close">Cancelar</button>`);typeBtns()}
function typeBtns(){$("#ft").innerHTML=Object.keys(TN).map(k=>`<button class="ty ${F.type===k?"on":""}" data-a="type" data-k="${k}"><b>${TN[k]}</b><small>${pt(pv(F.svc,k))}</small></button>`).join("");$("#fw").style.display=svm(F.svc)?"none":"";$("#ftot").textContent=tot(F.svc,F.type)}
document.addEventListener("change",e=>{if(e.target.id==="fs"){F.svc=e.target.value;typeBtns()}});
function mask(v){v=v.replace(/\D/g,"").slice(0,11);return v.length>6?`(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`:v.length>2?`(${v.slice(0,2)}) ${v.slice(2)}`:v}
document.addEventListener("input",e=>{if(e.target.id==="fp")e.target.value=mask(e.target.value)});
async function confirmB(btn){if(F.busy)return;const n=$("#fn").value.trim(),p=$("#fp").value.trim(),e=$("#fe").value.trim(),v=$("#fv").value.trim(),c=$("#fc").value.trim();
 if(n.length<3)return toast("Informe o nome");if(p.replace(/\D/g,"").length<10)return toast("Informe um telefone válido");
 if(e&&!/^\S+@\S+\.\S+$/.test(e))return toast("E-mail inválido");if(!v)return toast("Informe o veículo");if(!c)return toast("Informe a cor");
 F.busy=1;btn.disabled=true;btn.textContent="Enviando…";
 const row={date:F.d,time:F.t,status:"agendado",name:n,phone:p,email:e||null,type:svm(F.svc)?"":F.type,svc:F.svc,price:pv(F.svc,F.type)||0,vehicle:v,color:c};
 try{await api("bookings",{method:"POST",body:row,prefer:"return=minimal",auth:F.admin})}
 catch(err){F.busy=0;btn.disabled=false;btn.textContent="Confirmar";if(err.status===409){toast("Esse horário acabou de ser ocupado");closeSheet();refresh()}else if(err.status===401||err.status===403)toast("Sem permissão para agendar");else toast("Erro ao salvar. Tente de novo");return}
 await refresh();
 if(F.admin){closeSheet();return toast("Agendamento criado")}
 const msg=encodeURIComponent(`Olá! Agendei na Peres Lavagem: ${fmt(F.d)} às ${F.t}. ${svn(F.svc)} · ${svm(F.svc)?"":TN[F.type]} ${v} ${c}. Nome: ${n}.`);
 sheet(`<div class="ok-box"><div class="ck">✓</div><h2>Agendado!</h2><p class="det">${fmt(F.d)} às ${F.t} · ${esc(v)} ${esc(c)}<br>Total: ${tot(F.svc,F.type)}</p>
 <a class="btn w" style="display:block;text-decoration:none;text-align:center" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${msg}">Avisar no WhatsApp</a><br><button class="btn g w" data-a="close">Fechar</button></div>`)}
/* ADMIN */
function agg(f){let n=0,prev=0,done=0;for(const dd in S.book)if(f(dd))for(const t in S.book[dd]){const x=S.book[dd][t];if(x.ref||x.status==="bloqueado"||x.status==="cancelado")continue;n++;prev+=x.price||0;if(x.status==="concluido")done+=x.price||0}return{n,prev,done}}
function adm(){const d=aSel,day=S.book[d]||{},dt=new Date(d+"T12:00:00"),mo=new Date(dt);mo.setDate(dt.getDate()-(dt.getDay()+6)%7);const w0=dk(mo);mo.setDate(mo.getDate()+6);const w1=dk(mo);
 const P=[["Dia · "+fmt(d),agg(k=>k===d)],["Semana · "+fmt(w0)+" a "+fmt(w1),agg(k=>k>=w0&&k<=w1)],["Mês · "+String(dt.getMonth()+1).padStart(2,"0")+"/"+dt.getFullYear(),agg(k=>k.slice(0,7)===d.slice(0,7))]];
 let h=`<div class="top"><div><h2>Painel Admin</h2><small>Peres Lavagem Automotiva</small></div><div class="sp"></div><button class="btn g sm" data-a="exit">Sair</button></div>
 <div class="tabs">${[["ag","Agenda"],["cl","Clientes"],["cf","Config"]].map(([k,n])=>`<button class="tab ${tab===k?"on":""}" data-a="tab" data-k="${k}">${n}</button>`).join("")}</div>`;
 if(tab==="ag"){h+=`<div class="days">${daysHtml(d,"aday")}</div><div style="margin-top:12px">${P.map(([n,a])=>`<div class="st per"><div><span>${n}</span><b>${a.n} lavage${a.n===1?"m":"ns"}</b></div><div><span>Faturamento</span><b>${brl(a.done)}</b><small>previsto ${brl(a.prev)}</small></div></div>`).join("")}</div>`;
  SL.forEach(([a,u],i)=>{if(a==="13:30")h+=`<div class="lunch">🍴 Almoço · 12:00 às 13:30</div>`;const x=day[a];
   if(!x)h+=`<div class="slot"><div class="tm">${a}</div><div class="inf"><b>Livre</b><small>Até ${u}</small></div><div class="acts" style="margin:0"><button class="btn sm" data-a="mbook" data-t="${a}">+ Agendar</button><button class="btn g sm" data-a="block" data-t="${a}">Bloquear</button></div></div>`;
   else if(x.status==="bloqueado")h+=`<div class="slot busy"><div class="tm">${a}</div><div class="inf"><b>Bloqueado</b><small>Até ${u}</small></div><button class="btn g sm" data-a="free" data-t="${a}">Liberar</button></div>`;
   else if(x.ref)h+=`<div class="slot busy"><div class="tm">${a}</div><div class="inf"><b>${esc(x.name)}</b><small>Continuação da ${svn(x.svc).toLowerCase()} das ${x.ref}</small></div><span class="pill d">${x.status}</span></div>`;
   else{const pc={agendado:"d",concluido:"f",cancelado:"o"}[x.status];h+=`<div class="slot busy" style="flex-wrap:wrap"><div class="tm">${a}</div><div class="inf"><b>${esc(x.name)}</b><small>${svn(x.svc)} · ${TN[x.type]?TN[x.type]+" · ":""}${esc(x.vehicle)} ${esc(x.color)} · ${x.price?brl(x.price):"valor a definir"}${x.span?" · ocupa a manhã toda":""}</small></div><span class="pill ${pc}">${x.status}</span>
   <div class="det" style="width:100%">${esc(x.phone||"sem telefone")}${x.email?" · "+esc(x.email):""}</div><div class="acts" style="width:100%">${x.phone?`<a class="btn g sm" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/55${x.phone.replace(/\D/g,"")}">WhatsApp</a>`:""}${x.status==="agendado"?`<button class="btn ok sm" data-a="done" data-t="${a}">Concluir</button>`:""}<button class="btn r sm" data-a="free" data-t="${a}">${x.status==="cancelado"?"Remover":"Cancelar"}</button></div></div>`}})}
 if(tab==="cl"){const m={};Object.entries(S.book).forEach(([dd,o])=>Object.entries(o).forEach(([t,x])=>{if(x.ref||x.status==="bloqueado"||x.status==="cancelado")return;const k=x.name.toLowerCase();const c=m[k]=m[k]||{x,n:0,tot:0,last:""};c.n++;c.tot+=x.price||0;if(dd>c.last)c.last=dd}));
  const L=Object.values(m).sort((a,b)=>b.n-a.n);h+=L.length?L.map(c=>`<div class="card"><b>${esc(c.x.name)}</b> <span class="pill d">${c.n} lavagem(ns)</span><div class="det">${esc(c.x.phone||"sem telefone")}${c.x.email?" · "+esc(c.x.email):""}<br>${esc(c.x.vehicle)} ${esc(c.x.color)} · Último: ${fmt(c.last)} · ${brl(c.tot)}</div></div>`).join(""):`<p class="det">Nenhum cliente ainda.</p>`}
 if(tab==="cf"){h+=`<div class="card"><b class="hd">Valores dos serviços (R$)</b><p class="det">Deixe em branco para aparecer “Sob consulta” para o cliente.</p>${SV.map(s=>`<label style="color:var(--tx);font-weight:600;font-size:14px">${s[1]}</label><div class="row">${(s[3]==="u"?["u"]:Object.keys(TN)).map(k=>`<div><label>${k==="u"?(s[4]?"A PARTIR DE":"VALOR"):TN[k].toUpperCase()}</label><input type="number" min="0" inputmode="decimal" data-s="${s[0]}" data-k="${k}" value="${(S.svc[s[0]]||{})[k]??""}"></div>`).join("")}</div>`).join("")}
  <br><button class="btn w" data-a="cfg">Salvar valores</button></div>
  <div class="card"><b class="hd">Conta</b><p class="det">Dados salvos no Supabase. Você está logado como administrador.</p><div class="acts"><button class="btn g sm" data-a="exp">Exportar JSON</button><button class="btn r sm" data-a="logout">Encerrar sessão</button></div></div>`}
 $("#am").innerHTML=h}
const root=t=>{const x=bk(aSel,t);return x&&x.ref?x.ref:t};
const flt=t=>"bookings?date=eq."+aSel+"&or="+encodeURIComponent(`(time.eq.${root(t)},ref.eq.${root(t)})`);
async function act(fn,ok){try{await fn();await refresh();toast(ok)}catch(e){toast(e.status===409?"Horário já ocupado":"Erro. Tente de novo");refresh()}}
function openAdmin(){if(S.admin){$("#adm").classList.add("on");return adm()}
 sheet(`<h2 style="font-size:20px">Área do administrador</h2><label>E-MAIL</label><input id="ae" type="email" autocomplete="username"><label>SENHA</label><input id="ap" type="password" autocomplete="current-password"><br><br><button class="btn w" data-a="login">Entrar</button>`)}
async function doLogin(btn){const em=$("#ae").value.trim(),pw=$("#ap").value;if(!em||!pw)return toast("Informe e-mail e senha");btn.disabled=true;btn.textContent="Entrando…";
 try{const r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})});if(!r.ok)throw 1;setSess(await r.json());
  const a=await api("admins?select=user_id",{auth:true});if(!a||!a.length){setSess(null);throw 2}
  S.admin=true;closeSheet();$("#adm").classList.add("on");await refresh()}
 catch(e){btn.disabled=false;btn.textContent="Entrar";toast(e===2?"Esta conta não é de administrador":"E-mail ou senha incorretos")}}
async function saveCfg(){const n=JSON.parse(JSON.stringify(S.svc));document.querySelectorAll("[data-s]").forEach(i=>{n[i.dataset.s]=n[i.dataset.s]||{};n[i.dataset.s][i.dataset.k]=i.value===""?"":Math.max(0,+i.value||0)});
 try{await api("config?id=eq.1",{method:"PATCH",auth:true,body:{svc:n,updated_at:new Date().toISOString()}});await refresh();toast("Valores salvos")}catch(e){toast("Não foi possível salvar")}}
function logout(){setSess(null);S.admin=false;$("#adm").classList.remove("on");refresh();toast("Sessão encerrada")}
document.addEventListener("click",ev=>{const el=ev.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,t=el.dataset.t,k=el.dataset.k;if(el.tagName==="A"&&el.getAttribute("href")==="#")ev.preventDefault();
 if(a==="day"){sel=el.dataset.d;render()}
 else if(a==="aday"){aSel=el.dataset.d;adm()}
 else if(a==="book")form(sel,t,false);
 else if(a==="mbook")form(aSel,t,true);
 else if(a==="type"){F.type=k;typeBtns()}
 else if(a==="confirm")confirmB(el);
 else if(a==="close")closeSheet();
 else if(a==="retry")refresh();
 else if(a==="admin")openAdmin();
 else if(a==="login")doLogin(el);
 else if(a==="exit"){$("#adm").classList.remove("on");render()}
 else if(a==="tab"){tab=k;adm()}
 else if(a==="block")act(()=>api("bookings",{method:"POST",auth:true,body:{date:aSel,time:t,status:"bloqueado"},prefer:"return=minimal"}),"Horário bloqueado");
 else if(a==="free")act(()=>api(flt(t),{method:"DELETE",auth:true}),"Horário liberado");
 else if(a==="done")act(()=>api(flt(t),{method:"PATCH",auth:true,body:{status:"concluido"}}),"Marcado como concluído");
 else if(a==="cfg")saveCfg();
 else if(a==="logout")logout();
 else if(a==="exp"){const b=new Blob([JSON.stringify(S.book,null,1)],{type:"application/json"});const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download="peres-agenda.json";l.click();toast("Exportando…")}
});
$("#md").addEventListener("click",e=>{if(e.target.id==="md")closeSheet()});
render();init();
</script></body></html>
